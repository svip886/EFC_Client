name: Release

# 目标：多平台构建并挂 GitHub Release。
# Android 用固定 keystore 签名（Secrets 注入，签名稳定可覆盖升级）；Windows zip（需 WebView2）；macOS zip；iOS 无签名 zip。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.1). Empty = use pubspec version as vX.Y.Z'
        required: false
        default: ''

permissions:
  contents: write

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      full: ${{ steps.ver.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_LINE=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          PUB_NAME="${PUBSPEC_LINE%%+*}"
          PUB_BUILD="${PUBSPEC_LINE##*+}"
          if [[ "$PUB_BUILD" == "$PUBSPEC_LINE" ]]; then PUB_BUILD="1"; fi

          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "${TAG}" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          if [[ -z "${TAG}" ]]; then
            TAG="v${PUB_NAME}"
          fi

          NAME="$PUB_NAME"
          BUILD="$PUB_BUILD"
          TRAW="${TAG#v}"
          if [[ "$TRAW" == *"+"* ]]; then
            NAME="${TRAW%%+*}"
            BUILD="${TRAW##*+}"
          elif [[ -n "$TRAW" ]]; then
            NAME="$TRAW"
          fi

          FULL="${NAME}+${BUILD}"
          {
            echo "tag=${TAG}"
            echo "version=${NAME}"
            echo "build=${BUILD}"
            echo "full=${FULL}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} full=${FULL}"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set, falling back to debug signing"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ecfc-release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=ecfc-release.jks"
          } > android/key.properties
          echo "signing key ready: $(ls -la android/app/ecfc-release.jks)"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ needs.version.outputs.version }}"
          APK="ecfc-${VER}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows release
        shell: cmd
        run: |
          set CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $root = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $root)) {
            $root = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
              Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Packing $root"
          $out = "dist/ecfc-$ver-windows-x64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $out -Force
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i '' -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist
          APP=$(find build/macos -name '*.app' -type d | head -n1)
          echo "Found app: $APP"
          OUT="ecfc-${VER}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${OUT}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i '' -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter pub get
      - name: Build iOS no-codesign
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
      - name: Package unsigned payload zip
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist
          APP=$(find build/ios -name 'Runner.app' -type d | head -n1)
          echo "Found: $APP"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          OUT="ecfc-${VER}-ios-unsigned.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/${OUT}" Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, android, windows, macos, ios]
    if: ${{ always() && needs.version.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + version.json
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -print -exec cp -v {} dist/ \;
          ls -la dist
          python3 <<'PY'
          import json, glob
          from pathlib import Path

          def one(pattern: str) -> str:
              files = sorted(glob.glob(pattern))
              return Path(files[0]).name if files else ""

          ver = "${{ needs.version.outputs.version }}"
          build = int("${{ needs.version.outputs.build }}")
          tag = "${{ needs.version.outputs.tag }}"
          repo = "${{ github.repository }}"
          apk = one("dist/*-android.apk")
          win = one("dist/*-windows-x64.zip")
          mac = one("dist/*-macos.zip")
          ios = one("dist/*-ios-unsigned.zip")
          if not apk:
              raise SystemExit("Android APK missing; refuse to publish")
          download = f"https://github.com/{repo}/releases/download/{tag}/{apk}"
          data = {
              "latestVersion": ver,
              "latestBuild": build,
              "minBuild": 1,
              "force": False,
              "notes": f"GitHub Release {tag}",
              "downloadUrl": download,
              "assets": {
                  "androidApk": apk,
                  "windowsZip": win,
                  "macosZip": mac,
                  "iosUnsignedZip": ios,
              },
          }
          text = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          Path("dist/version.json").write_text(text, encoding="utf-8")
          Path("app").mkdir(exist_ok=True)
          Path("app/version.json").write_text(text, encoding="utf-8")
          print(text)
          PY
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
