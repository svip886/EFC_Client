name: Release

# 目标：能打包出多平台产物并挂到 GitHub Release（不要求商店上架/签名分发）。
# - Android: release APK（1 个）
# - Windows: zip（内含 exe + 依赖；运行需 WebView2）
# - macOS: zip（.app）
# - iOS: 无签名 ipa（flutter build ipa --no-codesign），仅作构建验证/自签原料

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.1). Empty = use pubspec version as vX.Y.Z'
        required: false
        default: ''

permissions:
  contents: write

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      full: ${{ steps.ver.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_LINE=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          PUB_NAME="${PUBSPEC_LINE%%+*}"
          PUB_BUILD="${PUBSPEC_LINE##*+}"
          if [[ "$PUB_BUILD" == "$PUBSPEC_LINE" ]]; then PUB_BUILD="1"; fi

          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "${TAG}" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          if [[ -z "${TAG}" ]]; then
            TAG="v${PUB_NAME}"
          fi

          NAME="$PUB_NAME"
          BUILD="$PUB_BUILD"
          TRAW="${TAG#v}"
          if [[ "$TRAW" == *"+"* ]]; then
            NAME="${TRAW%%+*}"
            BUILD="${TRAW##*+}"
          elif [[ -n "$TRAW" ]]; then
            NAME="$TRAW"
          fi

          FULL="${NAME}+${BUILD}"
          {
            echo "tag=${TAG}"
            echo "version=${NAME}"
            echo "build=${BUILD}"
            echo "full=${FULL}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} full=${FULL}"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ needs.version.outputs.version }}"
          BUILD="${{ needs.version.outputs.build }}"
          APK="ecfc-${VER}+${BUILD}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK}"
          echo "apk=${APK}" >> "$GITHUB_ENV"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.version.outputs.version }}'
          $build = '${{ needs.version.outputs.build }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $root = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $root)) {
            $root = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
              Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Packing $root"
          $out = "dist/ecfc-$ver+$build-windows-x64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $out -Force
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i '' -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          BUILD="${{ needs.version.outputs.build }}"
          mkdir -p dist
          APP=$(find build/macos -name '*.app' -type d | head -n1)
          echo "Found app: $APP"
          OUT="ecfc-${VER}+${BUILD}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${OUT}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync pubspec version
        run: |
          set -euo pipefail
          sed -i '' -E "s/^version: .*/version: ${{ needs.version.outputs.full }}/" pubspec.yaml
          grep -E '^version:' pubspec.yaml
      - run: flutter pub get
      # 无开发者证书：只求能编过；产物为 unsigned ipa / 构建目录打包
      - name: Build iOS no-codesign
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
      - name: Package unsigned payload zip
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          BUILD="${{ needs.version.outputs.build }}"
          mkdir -p dist
          APP=$(find build/ios -name 'Runner.app' -type d | head -n1)
          echo "Found: $APP"
          # 做成 Payload 结构，方便有证书时再签
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          OUT="ecfc-${VER}+${BUILD}-ios-unsigned.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/${OUT}" Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect + version.json
        id: pack
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          BUILD="${{ needs.version.outputs.build }}"
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          mkdir -p dist
          find artifacts -type f -print -exec cp -v {} dist/ \;
          ls -la dist

          APK=$(ls dist/*-android.apk | head -n1 | xargs -n1 basename)
          WIN=$(ls dist/*-windows-x64.zip 2>/dev/null | head -n1 | xargs -n1 basename || true)
          MAC=$(ls dist/*-macos.zip 2>/dev/null | head -n1 | xargs -n1 basename || true)
          IOS=$(ls dist/*-ios-unsigned.zip 2>/dev/null | head -n1 | xargs -n1 basename || true)

          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK}"
          python3 - <<PY
          import json
          from pathlib import Path
          data = {
            "latestVersion": "${VER}",
            "latestBuild": int("${BUILD}"),
            "minBuild": 1,
            "force": False,
            "notes": "GitHub Release ${TAG} (Android/Windows/macOS/iOS-unsigned)",
            "downloadUrl": "${DOWNLOAD_URL}",
            "assets": {
              "androidApk": "${APK}",
              "windowsZip": "${WIN}",
              "macosZip": "${MAC}",
              "iosUnsignedZip": "${IOS}",
            },
          }
          text = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          Path("dist/version.json").write_text(text, encoding="utf-8")
          Path("app/version.json").write_text(text, encoding="utf-8")
          print(text)
          PY
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
